name: Validar entregable

on:
  pull_request:
    paths:
      - 'ideas/**'

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Revisar canvas y pitch
        shell: bash
        run: |
          set -uo pipefail
          REQUERIDOS=(lean-canvas.md pitch.md)
          errores=0
          avisos=0

          equipos=$(find ideas -mindepth 1 -maxdepth 1 -type d ! -name 'equipo-00-ejemplo' | sort)

          echo "# Validación del entregable" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"

          if [ -z "$equipos" ]; then
            echo "⚠️ No se encontró carpeta en \`ideas/\`. ¿Crearon \`ideas/equipo-XX-nombre-corto/\`?" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          for dir in $equipos; do
            echo "## \`$dir\`" >> "$GITHUB_STEP_SUMMARY"
            for f in "${REQUERIDOS[@]}"; do
              path="$dir/$f"
              if [ -f "$path" ]; then
                pendientes=$(grep -c '<[^>]*>' "$path" || true)
                if [ "$pendientes" -gt 0 ]; then
                  echo "- ⚠️ \`$f\` — quedan **$pendientes** campos \`<...>\` sin llenar" >> "$GITHUB_STEP_SUMMARY"
                  avisos=$((avisos+1))
                else
                  echo "- ✅ \`$f\`" >> "$GITHUB_STEP_SUMMARY"
                fi
              else
                echo "- ❌ **falta \`$f\`**" >> "$GITHUB_STEP_SUMMARY"
                errores=$((errores+1))
              fi
            done
            echo >> "$GITHUB_STEP_SUMMARY"
          done

          echo >> "$GITHUB_STEP_SUMMARY"
          if [ "$errores" -gt 0 ]; then
            echo "### ❌ Falta canvas o pitch. Súbanlos en el fork y el Pull Request se actualiza solo." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$avisos" -gt 0 ]; then
            echo "### ⚠️ Los archivos están, pero quedan campos por llenar." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ✅ Lean Canvas y pitch en su carpeta." >> "$GITHUB_STEP_SUMMARY"
          fi
